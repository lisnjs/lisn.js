<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="assets/lisn/js/lisn.min.js" charset="utf-8"></script>
    <script src="assets/js/lisn-settings.js" charset="utf-8"></script>
    <link
      rel="stylesheet"
      href="assets/lisn/css/lisn.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
    <style type="text/css" media="screen">
      .section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .box {
        background: blue;
        flex-grow: 1;
        width: 200px;
        height: 10px;
      }

      .box:nth-child(odd) {
        background: yellow;
        width: 300px;
      }

      .spacer {
        height: 200vh;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>

    <div class="section">
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
    </div>

    <div class="spacer"></div>
    <div class="spacer"></div>

    <script>
      // Make the page content fixed with smooth scrolling + automatically
      // adjust scroll height based on content, etc
      LISN.widgets.SmoothScroll.enableMain().then((w) => {
        const rootComposer = w.getComposer();
        const { trigger } = rootComposer.getConfig();

        const {
          FXComposer,
          FXScrollTrigger,
          FXPin,
          FXNegateMatcher,
          FXViewMatcher,
          FXScrollMatcher,
          Transform,
        } = LISN.effects;

        const section = document.querySelector(".section");
        const boxes = section.querySelectorAll(".box");
        const evenBoxes = [...boxes].filter((_, i) => i % 2 === 0);
        const oddBoxes = [...boxes].filter((_, i) => i % 2 === 1);

        const sectionInView = new FXViewMatcher("at", section);
        const sectionInCentre = new FXViewMatcher("at", section, {
          rootMargin: { top: "-30%", bottom: "-30%" },
        });

        // 500 px up or down from when it's restarted
        const scrolledAway = new FXScrollMatcher({
          max: { top: "+500" },
          min: { top: "-500" },
        });
        // start counting from when the section is in the middle of the viewport
        sectionInCentre.onChange(scrolledAway.restart);

        // pin for the vertical translate effect
        const translateYPin = new FXPin()
          .when(sectionInCentre) // pin it when it's in the middle of the viewport
          .until(scrolledAway); // unpin it when user scrolls 500px up or down from that time

        // pin for the horizontal translate effect
        const translateXPin = new FXPin()
          .while(sectionInView.invert()) // keep it pinned while the section is not in the viewport
          .while(translateYPin); // and also the same conditions as for the Y pin

        const trXLeft = new Transform().translate((p) => ({ x: -p.y }));

        const trXRight = new Transform().translate((p) => ({ x: p.y }));

        const trYOpposite = new Transform().translate((p) => ({
          y: p.y,
        }));

        // oppose the vertical transform
        new FXComposer({ trigger })
          .add(trYOpposite, translateYPin)
          .startAnimate(section);
      });
    </script>
  </body>
</html>
