<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="assets/js/lisn.link.js" charset="utf-8"></script>
    <script src="assets/js/lisn-settings.js" charset="utf-8"></script>
    <script charset="utf-8">
      LISN.widgets.SmoothScroll.enableMain({ lag: 300 });
    </script>
    <link
      rel="stylesheet"
      href="assets/lisn/css/lisn.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
    <style type="text/css" media="screen">
      .overflow {
        min-width: 200vw;
        min-height: 200vh;
      }

      .section {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-evently;
        margin: 10vh 0;
        gap: 10vw;
      }

      .box {
        background: blue;
        flex-grow: 1;
        height: 100px;
      }

      .box:nth-child(odd) {
        background: yellow;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="overflow">
      <div class="section">
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
      </div>

      <div class="section">
        <span
          class="box"
          data-lisn-smooth-scroll-layer="lag=0 | depth=0.8"
        ></span>
        <span
          class="box"
          data-lisn-smooth-scroll-layer="lag=1200 | depth=1.3"
        ></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
      </div>

      <div class="section">
        <span
          class="box"
          data-lisn-smooth-scroll-layer="lag=0 | depth=0.8"
        ></span>
        <span
          class="box"
          data-lisn-smooth-scroll-layer="lag=1200 | depth=1.3"
        ></span>
        <span class="box"></span>
        <span class="box"></span>
      </div>

      <div class="section">
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
        <span class="box"></span>
      </div>
    </div>
  </body>
</html>
