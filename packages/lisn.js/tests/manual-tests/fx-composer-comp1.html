<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <script src="assets/js/lisn.link.js" charset="utf-8"></script>
    <script src="assets/js/lisn-settings.js" charset="utf-8"></script>
    <link
      rel="stylesheet"
      href="assets/lisn/css/lisn.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
    <script>
      LISN.settings.effectLag = 1;
      LISN.settings.verbosityLevel = 10;
      // LISN.settings.compactLogging = true;
      LISN.settings.debugMessageFilter = /FXComposer/;
    </script>
    <style type="text/css" media="screen">
      .section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .box {
        background: blue;
        flex-grow: 1;
        width: 200px;
        height: 10px;
      }

      .box:nth-child(odd) {
        background: yellow;
        width: 300px;
      }

      .spacer {
        height: 150vh;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>

    <div class="section">
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
      <span class="box"></span>
    </div>

    <div class="spacer"></div>
    <div class="spacer"></div>

    <script>
      // Make the page content fixed with smooth scrolling + automatically
      // adjust scroll height based on content, etc
      LISN.widgets.SmoothScroll.enableMain({ defaultEffects: false }).then(
        (w) => {
          const rootComposer = w.getComposer();
          const { trigger } = rootComposer.getConfig();
          const { FXComposer, FXPin, FXViewClamp, FXComposerClamp, Transform } =
            LISN.effects;
          const section = document.querySelector(".section");
          const boxes = section.querySelectorAll(".box");
          const evenBoxes = [...boxes].filter((_, i) => i % 2 === 0);
          const oddBoxes = [...boxes].filter((_, i) => i % 2 === 1);

          const boxesNotInView = new FXViewClamp({
            top: { min: 0, max: "100%" },
          }).invert();

          const sectionInCentre = new FXViewClamp({ top: "50%" }); // XXX middle at 50%

          // 500 px up or down from when it's restarted
          const scrolledAway = new FXComposerClamp({
            y: { max: "+500", min: "-500" },
          });

          const translateYPin = new FXPin()
            .when(sectionInCentre)
            .until(scrolledAway);

          // pin for the horizontal translate effect
          // const translateXPin = new FXPin().while(boxesNotInView);

          const trY = new Transform({
            pin: translateYPin,
          }).translate((p) => ({
            y: -p.y,
          }));
          // const trXLeft = new Transform({ pin: translateXPin })
          //   .translate((p, state) => ({ x: -p.y + state.x.high / 2 }));
          // const trXRight = new Transform({ pin: translateXPin })
          //   .translate((p, state) => ({ x: p.y - state.x.high / 2 }));

          new FXComposer([section], { trigger }).add(trY);
          // new FXComposer(evenBoxes, { trigger, negateParent: false }).add(
          //   trXLeft,
          // );
          // new FXComposer(oddBoxes, { trigger, negateParent: false }).add(
          //   trXRight,
          // );
        },
      );
    </script>
  </body>
</html>
